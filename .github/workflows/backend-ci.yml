name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEFAULT_AGENT_PROVIDER: mock
      ALLOW_MOCK_FALLBACK: "true"
      TEST_DATABASE_URL: sqlite+aiosqlite:///./test.db
      XINGCHEN_ENABLED: "false"
      XINGCHEN_PUBLICATION_STATUS: not_published
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints/backend-ci.txt -e "apps/api[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy apps/api/app
      - name: Pytest
        run: |
          mkdir -p ci-artifacts
          pytest --junitxml=ci-artifacts/pytest.xml
      - name: Repo drift check
        run: python scripts/check_repo_drift.py --report-json ci-artifacts/drift.json --report-md ci-artifacts/drift.md
      - name: Solver parity canary gate (synthetic)
        run: |
          python scripts/create_synthetic_solver_parity_fixture.py "$RUNNER_TEMP/solver-parity.json"
          python scripts/evaluate_solver_parity.py "$RUNNER_TEMP/solver-parity.json" --require-canary-eligible
      - name: Runtime plan proposal canary gate (synthetic)
        run: |
          python scripts/create_synthetic_runtime_plan_proposal_fixture.py "$RUNNER_TEMP/runtime-plan-proposals.json"
          python scripts/evaluate_runtime_plan_proposals.py "$RUNNER_TEMP/runtime-plan-proposals.json" --require-canary-eligible
      - name: Export OpenAPI
        run: python scripts/export_openapi.py
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Audit course assets
        run: python scripts/audit_course_assets.py --course CT --course AE
      - name: Scan sensitive files
        run: python scripts/check_sensitive_files.py
      - name: Validate benchmark samples
        run: python evaluation/circuit_theory/scripts/validate_cases.py
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Summarize CI results (readable report)
        if: always()
        run: |
          mkdir -p ci-artifacts
          {
            echo "# Backend CI report"
            echo ""
            echo "- status: ${{ job.status }}"
            echo "- workflow: ${{ github.workflow }}"
            echo "- sha: ${{ github.sha }}"
          } > ci-artifacts/ci-report.md
          if [ -f ci-artifacts/drift.md ]; then cat ci-artifacts/drift.md >> ci-artifacts/ci-report.md; fi
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ci-artifacts/
          if-no-files-found: ignore

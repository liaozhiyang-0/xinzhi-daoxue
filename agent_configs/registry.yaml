agents:
  SOLVER_CT_V1:
    provider: xingchen
    workflow_version: "1.0.0"
    course_pack: course_ct_v1
    enabled: false
    publication_status: not_published
    supports_streaming: false
    default_timeout_seconds: 120
    fallback:
      provider: mock
      when:
        - xingchen_disabled
        - xingchen_not_configured
        - xingchen_not_published
  LEARN_01_KNOWLEDGE_QA_V1:
    provider: local
    workflow_version: "1.0.0"
    course_pack: local_three_course_v1
    enabled: true
    publication_status: local
    mode: retrieval_only
    supports_streaming: true

routing:
  - course_ids: [CT]
    intents: [solve_problem]
    agent_id: SOLVER_CT_V1
    scene: solving
    retrieval_required: false
    provider_required: true
  - course_ids: [CT, AE, DE]
    intents: [general_qa, explain_concept]
    agent_id: LEARN_01_KNOWLEDGE_QA_V1
    scene: learning
    retrieval_required: true
    provider_required: false

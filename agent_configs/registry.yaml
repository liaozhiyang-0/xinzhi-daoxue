routing:
  - course_ids: [CT, AE, DE, SS, DSP, COMM, RF, EM, INFO, EMBEDDED, IC]
    intents: [solve_problem]
    agent_id: ACADEMIC_PROBLEM_SOLVER
    scene: learning
    retrieval_required: true
    provider_required: false
  - course_ids: [CT]
    intents: [check_user_solution, verify_answer]
    agent_id: ACADEMIC_PROBLEM_SOLVER
    scene: learning
    retrieval_required: true
    provider_required: false
  - course_ids: [CT, AE, DE, SS, DSP, COMM]
    intents: [general_qa, explain_concept, summarize_knowledge, learning_advice]
    agent_id: LEARN_01_LOCAL_RETRIEVAL_V1
    scene: learning
    retrieval_required: true
    provider_required: false

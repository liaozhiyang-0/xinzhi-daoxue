[pytest]
testpaths = apps/api/tests
pythonpath = . apps/api
asyncio_mode = auto
addopts = --cov=app --cov-report=term-missing
markers =
    integration: requires downloaded local models or persistent services
    requires_api_key: consumes a configured paid model API and is skipped by default
    slow: resource-intensive model inference
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning

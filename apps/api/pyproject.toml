[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xinzhi-daoxue-api"
version = "0.1.0"
description = "FastAPI shell for the Xinzhi Daoxue multi-agent platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.3,<1",
  "minio>=7.2,<8",
  "networkx>=3.2,<4",
  "openai>=1.68,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=16,<24",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "qdrant-client>=1.13,<2",
  "pyyaml>=6.0,<7",
  "redis>=5.1,<7",
  "sqlalchemy>=2.0,<3",
  "sympy>=1.13,<2",
  "sentence-transformers>=3.4,<6",
  "schemdraw>=0.21,<1",
  "torch>=2.7,<3",
  "transformers>=4.49,<5",
  "typing-extensions>=4.12,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "types-networkx>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = [
  "integration: requires downloaded local models or persistent services",
  "requires_api_key: consumes a configured paid model API and is skipped by default",
  "slow: resource-intensive model inference",
]

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能学习 · 芯智导学</title><link rel="stylesheet" href="/debug-assets/design-tokens.css"><link rel="stylesheet" href="/debug-assets/app-shell.css"><link rel="stylesheet" href="/debug-assets/components.css"><link rel="stylesheet" href="/debug-assets/pages.css"></head>
<body class="student-page"><aside id="app-sidebar" class="app-sidebar"></aside><header id="app-topbar" class="app-topbar"></header><main class="app-main student-main"><section class="student-toolbar" aria-label="学习模式"><div class="segmented"><button class="active" type="button" data-mode="learn">知识问答</button><button type="button" data-mode="solve">电路解题</button></div><button id="new-session" class="button secondary" type="button">新建会话</button></section><section id="conversation" class="conversation"><div id="welcome" class="student-welcome"><p class="eyebrow">SMART LEARNING</p><h1>今天想学习什么？</h1><p>围绕电路理论、模拟电子技术与数字电子技术提问，或提交一道电路理论题。</p><div class="prompt-grid"><button type="button" data-prompt="解释电容电压为什么不能突变" data-course="CT"><strong>电容连续性</strong><span>电路理论 · CT</span></button><button type="button" data-prompt="总结负反馈的作用" data-course="AE"><strong>负反馈</strong><span>模拟电子技术 · AE</span></button><button type="button" data-prompt="比较锁存器和触发器" data-course="DE"><strong>时序逻辑</strong><span>数字电子技术 · DE</span></button><button type="button" data-prompt="一个10V电压源串联5Ω电阻，求回路电流。" data-course="CT" data-prompt-mode="solve"><strong>电路理论解题</strong><span>专业工作流 · CT</span></button></div></div><div id="messages" class="message-list" aria-live="polite"></div><section id="answer-panel" class="assistant-answer" hidden><header class="answer-meta"><div><span id="answer-status" class="status-badge status-running">运行中</span><strong id="answer-agent">正在路由</strong></div><span id="answer-route" class="answer-route"></span></header><div id="answer-text" class="markdown-viewer"></div><div id="answer-notices" class="notice-stack"></div><div class="answer-actions"><button id="copy-answer" type="button" class="text-button">复制回答</button><button id="toggle-sources" type="button" class="text-button">查看来源</button><button id="follow-up" type="button" class="text-button">继续追问</button><button id="reask" type="button" class="text-button">重新提问</button></div><details id="source-details" class="source-accordion"><summary><span id="source-summary">参考课程资料 0</span></summary><div id="source-list" class="source-list"></div><div id="related-images" class="image-grid"></div></details></section></section><form id="student-form" class="student-composer"><div id="image-preview" class="upload-preview" hidden><img id="preview-image" alt="待上传题目图片预览"><span id="image-name"></span><button id="remove-image" type="button" aria-label="移除图片">移除</button></div><textarea id="question-input" maxlength="4000" required aria-label="学习问题" placeholder="输入课程问题；Shift+Enter 换行"></textarea><div class="composer-controls"><div class="composer-left"><label class="select-label">课程<select id="course-select"><option value="AUTO">自动识别</option><option value="CT">电路理论 CT</option><option value="AE">模拟电子技术 AE</option><option value="DE">数字电子技术 DE</option></select></label><label id="image-label" class="icon-upload" hidden><span>上传图片</span><input id="image-input" type="file" accept="image/jpeg,image/png,image/webp"></label><details class="more-settings"><summary>更多设置</summary><div class="settings-popover"><label>回答深度<select id="depth-select"><option value="brief">简要</option><option value="standard" selected>标准</option><option value="deep">深入</option></select></label><label><input id="show-images" type="checkbox" checked> 显示教材图片</label></div></details></div><div class="composer-right"><span id="form-error" class="field-error" role="alert"></span><button id="stop-button" class="button secondary" type="button" disabled>停止</button><button id="send-button" class="button primary" type="submit">发送</button></div></div></form></main><div id="toast-region" class="toast-region" aria-live="polite"></div><script src="/debug-assets/ui-core.js"></script><script src="/debug-assets/student.js"></script></body></html>

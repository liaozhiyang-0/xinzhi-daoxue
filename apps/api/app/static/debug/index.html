<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芯智导学本地调试台</title>
  <link rel="stylesheet" href="/debug-assets/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">LOCAL STAGE 1.6</p>
      <h1>芯智导学本地调试台</h1>
      <p class="warning">课程问答为本地 retrieval_only 整理结果；解题仍为 Mock，不是讯飞星辰真实输出。</p>
    </header>

    <section class="panel">
      <h2>课程知识问答与统一任务入口</h2>
      <form id="task-form">
        <label>用户 ID <input id="user-id" value="debug-user" required></label>
        <label>课程
          <select id="course-id">
            <option value="CT">电路理论（CT）</option>
            <option value="AE">模拟电子技术（AE）</option>
            <option value="DE">数字电子技术（DE）</option>
          </select>
        </label>
        <label>意图
          <select id="intent">
            <option value="general_qa">课程知识问答</option>
            <option value="explain_concept">概念解释</option>
            <option value="solve_problem">解题</option>
          </select>
        </label>
        <label class="wide">问题
          <textarea id="question" rows="5" required>请演示本地任务链路。</textarea>
        </label>
        <label class="wide">附件（png/jpg/jpeg/pdf/md/txt）
          <input id="attachments" type="file" multiple accept=".png,.jpg,.jpeg,.pdf,.md,.txt">
        </label>
        <label>Mock 延迟（秒）
          <input id="delay" type="number" min="0" max="30" step="0.1" value="0.5">
        </label>
        <div class="actions wide">
          <button type="submit">创建任务</button>
          <button id="cancel" type="button" class="secondary" disabled>取消</button>
          <button id="retry" type="button" class="secondary" disabled>重试</button>
        </div>
      </form>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section class="panel">
      <h2>本地知识库检索</h2>
      <form id="knowledge-form">
        <label>课程
          <select id="knowledge-course">
            <option value="CT">电路理论（CT）</option>
            <option value="AE">模拟电子技术（AE）</option>
            <option value="DE">数字电子技术（DE）</option>
          </select>
        </label>
        <label class="wide">检索词
          <input id="knowledge-query" value="戴维南等效电路" required>
        </label>
        <div class="actions wide"><button type="submit">检索 Markdown</button></div>
      </form>
      <pre id="knowledge-result">等待检索…</pre>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>任务状态</h2>
        <dl id="task-summary">
          <dt>task_id</dt><dd>尚未创建</dd>
          <dt>status</dt><dd>-</dd>
          <dt>provider</dt><dd>-</dd>
          <dt>route</dt><dd>-</dd>
        </dl>
      </article>
      <article class="panel">
        <h2>最终结果</h2>
        <pre id="result">等待任务完成…</pre>
      </article>
    </section>

    <section class="panel">
      <h2>事件序列</h2>
      <ol id="events" class="events"></ol>
    </section>
  </main>
  <script src="/debug-assets/app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号入口 · 芯智导学</title>
  <link rel="stylesheet" href="/debug-assets/design-tokens.css">
  <link rel="stylesheet" href="/debug-assets/app-shell.css">
  <link rel="stylesheet" href="/debug-assets/components.css">
  <link rel="stylesheet" href="/debug-assets/admin.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-intro">
      <a class="brand-lockup auth-brand" href="/"><span class="brand-mark">芯</span><span class="brand-copy"><strong>芯智导学</strong><span>电子信息课程群智能学习平台</span></span></a>
      <p class="eyebrow">XINZHI DAOXUE</p>
      <h1>把课程知识带进每一次学习。</h1>
      <p>登录或注册后，你可以在个人学习工作区中持续保留会话、记忆与学习进度。</p>
    </section>
    <section class="card auth-card">
      <div class="section-heading"><div><h2 id="auth-title">登录账号</h2><p id="auth-description">使用登录名和密码继续学习。</p></div></div>
      <div class="auth-mode-switch" role="tablist" aria-label="账号操作">
        <button class="text-button active" type="button" data-auth-mode="login">登录</button>
        <button class="text-button" type="button" data-auth-mode="register">注册</button>
      </div>
      <form id="login-form" class="form-stack">
        <label>登录名<input name="login" type="text" autocomplete="username" required autofocus></label>
        <label data-register-only hidden>显示名称<input name="display_name" type="text" autocomplete="name" maxlength="255"></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
        <button class="button primary" type="submit" id="auth-submit">登录</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <button class="button quiet auth-guest-link" type="button" id="guest-entry">暂不注册，以游客模式进入</button>
    </section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/debug-assets/ui-core.js"></script>
  <script src="/debug-assets/login.js"></script>
</body>
</html>

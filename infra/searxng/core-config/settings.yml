use_default_settings: true

general:
  debug: false
  instance_name: "XZD Local SearXNG"
  privacypolicy_url: false
  donation_url: false
  enable_metrics: false

search:
  safe_search: 0
  default_lang: "auto"
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  secret_key: "replace-with-a-random-local-secret"
  # This instance binds to localhost only. The project adapter still enforces
  # a one-second minimum delay; disabling the public-instance bot limiter
  # avoids false 429s when the API calls SearXNG from the same machine.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

valkey:
  url: "valkey://valkey:6379/0"

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  useragent_suffix: " xinzhi-daoxue-local"

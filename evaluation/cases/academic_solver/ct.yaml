    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: kcl_kvl
    difficulty: easy
    input_type: text
    message: 使用KCL求节点电压，已知方程2*x=4。
    structured_input:
      equations_given: [2*x=4]
      target_quantities: [{name: x}]
      extraction_confidence: 0.95
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    expected_execution_paths: [FAST]
    expected_tools: [linear_equation_solver]
    reference_values: {x: 2}
    numeric_tolerance: 0.000001
    tags: [numeric, tool]


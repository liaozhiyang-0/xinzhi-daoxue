cases:
  - case_id: CT_CAPACITOR_001
    title: 电容电压连续性概念
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: first_order
    difficulty: easy
    input_type: text
    message: 为什么电容电压不能突变？
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    expected_execution_paths: [FAST, STANDARD]
    required_keywords: [电容]
    forbidden_claims: [电容电压可以瞬间任意改变]
    tags: [concept]

  - case_id: CT_KCL_001

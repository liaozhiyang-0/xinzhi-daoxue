  - case_id: CT_CONTROLLED_001
    title: 受控源方向冲突
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: controlled_source
    difficulty: hard
    input_type: text
    message: 分析含受控源的复杂电路，但题干中两处受控源参考方向互相冲突。
    structured_input:
      source_conflicts: [{description: 受控源参考方向不一致}]
      extraction_confidence: 0.45
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    expected_execution_paths: [HIGH_RISK]
    expected_statuses: [partial]
    required_keywords: [不确定性标记]
    forbidden_claims: [方向已经确定]
    tags: [high_risk, conflict]

  - case_id: CT_INSUFFICIENT_001
    title: 复杂电路关键参数缺失
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: controlled_source
    difficulty: boundary
    input_type: text
    message: 求含受控源电路的输出电压，但没有给出控制系数。
    structured_input:
      critical_missing_info: [{field: 受控源控制系数}]
      extraction_confidence: 0.7
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    expected_execution_paths: [CONDITIONAL]
    expected_statuses: [partial]
    required_keywords: [信息不足]
    forbidden_claims: [控制系数取1]
    tags: [insufficient]

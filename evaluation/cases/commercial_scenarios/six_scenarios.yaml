    expected_course_pack: CT
    expected_execution_paths: [STANDARD, HIGH_RISK]
    expected_citations: true
    min_citation_count: 2
    required_keywords: [objectives, prerequisites, activities, sources]
    required_steps: [objective_alignment, activity_design, post_class_verification]
    reference_solution:
      required_sections: [learning_objectives, prerequisites, activity_design, source_refs]
    evidence_requirements:
      standard_answer: course objectives and reviewed teaching assets

  - case_id: TF12_ERROR_POOL_EXACT
    title: 确定性错因池精确命中
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: power
    message: "已知电阻电压u=10V、电流i=2A，按关联参考方向求吸收功率。"
    structured_input:
      problem_type: power
      equations_given: ["P=10*2"]
      known_conditions:
        - {name: u, value: 10, unit: V}
        - {name: i, value: 2, unit: A}
      target_quantities:
        - {name: P, unit: W}
      structure_status: complete
      extraction_confidence: 0.99
    task_options:
      teaching_mode: check_my_work
      student_attempt: {raw_text: "P=u*i=20", final_answer: "P=20"}
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    error_pool_match_valid: true
    official_scoring: false
    tags: [synthetic_template, teaching_foundation]
    provenance: {source_type: synthetic, source_name: phase1_contract, publishable: true}


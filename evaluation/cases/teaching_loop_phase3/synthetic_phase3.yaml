cases:
  - case_id: TP3-01
    title: Attempt版本序号与修订关系保持完整
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    message: "将缺少单位的功率答案修改为20 W。"
    task_options:
      teaching_mode: check_my_work
      student_attempt: {raw_text: "P=20", final_answer: "20"}
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    evidence_requirements:
      evaluation_dimension: attempt_version_integrity
      expected_sequence: [1, 2]
      immutable_history: true
    official_scoring: false
    tags: [synthetic_template, teaching_loop_phase3, attempt_version_integrity]
    provenance: &phase3_provenance
      source_type: synthetic
      source_name: phase3_contract
      publishable: true


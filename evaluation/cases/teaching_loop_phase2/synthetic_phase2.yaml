cases:
  - case_id: TP2-01
    title: direct_answer保持完整回答和零额外模型调用
    course: CT
    task_family: ACADEMIC_SOLVING
    intent: solve_problem
    problem_type: power
    message: "已知电阻电压10V、电流2A，按关联参考方向求吸收功率。"
    structured_input: &power_input
      problem_type: power
      equations_given: ["P=10*2"]
      known_conditions:
        - {name: u, value: 10, unit: V}
        - {name: i, value: 2, unit: A}
      target_quantities:
        - {name: P, unit: W}
      structure_status: complete
      extraction_confidence: 0.99
    task_options: {teaching_mode: direct_answer}
    expected_agent: ACADEMIC_PROBLEM_SOLVER
    expected_course_pack: CT
    expected_teaching_execution_path: direct
    expected_disclosure_mode: full
    full_solution_disclosed: true
    no_additional_model_calls: true
    official_scoring: false
    tags: [synthetic_template, teaching_loop_phase2, direct]
    provenance: &phase2_provenance {source_type: synthetic, source_name: phase2_contract, publishable: true}


      expansion_path: 从故障诊断扩展到实验报告、复测任务和教师审核
    courses: [AE]
    agent_id: ACADEMIC_PROBLEM_SOLVER
    intents: [solve_problem]
    input_modes: [text]
    retrieval_profile: course_pack_grounded
    primary_value_metric: 故障定位可验证性与复测闭环覆盖率
    evidence_requirements: [用户测量现象, 工作状态依据, 验证步骤和人工复核边界]
    demo_steps: [D1现象归纳, D2工作区判断, D3候选原因, D4测量验证, D5安全边界, D6人工复核]
    demo_cases:
      - id: g2-16-bjt-cutoff
        role: student
        course: AE
        prompt: >-
          实验室调试 NPN 单管共射放大电路时，万用表测得集电极直流电位几乎等于 VCC，且输出波形严重顶部削峰。请诊断工作状态，列出三个可能原因并给出逐项验证步骤；不要把未测量的电路参数当作事实，并明确需要教师或实验人员复核的安全边界。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [observation_summary, operating_region, candidate_causes, diagnostic_steps, safety_boundary, review_boundary]
        business_context: 学生需要把实验测量现象转为可复测的工作区判断和故障排查顺序。
        evidence_requirements: [集电极直流电位, 输出削峰方向, 偏置和连接验证]
        review_boundary: 系统只能根据已给测量现象提出候选原因；实际断电测量、探头接地和电源安全必须由实验人员确认。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 不继承科研上下文, 工作区判断有现象依据, 至少三个可验证原因, 连续两次结构契约一致]
      - id: g2-17-integrator-drift
        role: student
        course: AE
        prompt: >-
          通用集成运放反相积分电路输入严格接地，但输出仍随时间缓慢向负电源轨漂移并最终饱和。请诊断非理想特性的根本原因，建议增加什么元件把输出控制在安全边界内，并说明如何通过时间常数、输出直流电平和饱和恢复实验验证；不要虚构器件参数。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [observation_summary, nonideality_diagnosis, compensation_component, diagnostic_steps, safety_boundary, review_boundary]
        business_context: 学生需要理解积分器漂移的非理想来源，并通过可操作实验验证补偿方案。
        evidence_requirements: [输入接地事实, 漂移方向和饱和现象, 偏置/漏电验证]
        review_boundary: 补偿元件的阻值、电容和电源范围必须结合实际运放数据手册与实验条件复核，系统不得补猜参数。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 不继承科研上下文, 非理想原因与现象对应, 补偿建议可验证, 连续两次结构契约一致]
    enabled: true

  - id: department_knowledge_governance_v1
    version: "1.0"
    name: 学院知识库治理与课程资产发布
    summary: 对课程资料进行版本、质量、来源和发布状态治理，支撑学院级知识服务。
    customer_segment: 高校学院、教务处与教育数字化服务商
    roles: [teacher]
    evidence_policy:
      authoritative_source_types: [knowledge_manifest, asset_review_queue, published_course_asset]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 学院、教务处或教育数字化服务商
      delivery_unit: 学院级课程资产与知识库治理空间
      value_capture: 按学院空间、课程资产量和治理服务订阅
      expansion_path: 从资料治理扩展到校级知识服务和权限审计
    courses: [CT, AE, DE, SS, DSP, COMM]
    agent_id: LEARN_01_KNOWLEDGE_QA_V1
    intents: [summarize_knowledge, general_qa]
    input_modes: [text]
    retrieval_profile: governed_knowledge
    primary_value_metric: 资料入库到可检索发布的周期与引用完整率
    evidence_requirements: [资产版本, 质量审查结果, 发布审批与访问控制]
    demo_steps: [D1资产清单, D2来源审查, D3版本冲突, D4审批发布, D5发布后检索, D6权限与回滚]
    demo_cases:
      - id: knowledge-governance
        role: teacher
        course: CT
        prompt: >-
          请检查 CT 课程知识库中准备发布的一组课程资产：讲义《节点电压法》v3、练习题包《直流网络》v2、教师修订说明 v1。请按资产清单逐项核对版本号、来源、最近审批状态和可追溯链接；找出讲义 v3 与练习题包 v2 之间可能的版本冲突，列出会阻塞发布的问题、需要补齐的审批或权限信息，并给出发布前、发布后和回滚后的检查清单。只能依据输入中提供的资产记录，缺失字段必须标记为未知，不能把建议当作已完成审批。
        expected_agent: LEARN_01_KNOWLEDGE_QA_V1
        expected_output: [asset_inventory, version_conflicts, source_audit, approval_status, publication_blockers, traceability_links, publication_checklist_before, publication_checklist_after, rollback_checklist, review_boundary]
        business_context: 学院管理员需要在课程资产发布前完成版本、来源、审批、权限和回滚治理。
        evidence_requirements: [资产清单与版本记录, 来源和审批记录, 可访问的追溯链接]
        review_boundary: 只有授权教师或管理员可以批准发布和回滚；系统只输出治理检查结果，不代替审批，也不把未知状态标为通过。
        acceptance_conditions: [路由到 LEARN_01_KNOWLEDGE_QA_V1, 未配置时降级到 LEARN_01_LOCAL_RETRIEVAL_V1, 版本来源审批阻塞项分别列出, 链接字段不张冠李戴, 缺失资料明确提示, 连续两次结构契约一致]
    enabled: true

version: "1.0"
scenarios:
  - id: faculty_course_copilot_v1
    version: "1.0"
    name: 教师智能备课与课程资源生成
    summary: 面向教师的课程目标拆解、备课提纲、例题和可追溯课件素材助手。
    customer_segment: 高校教师与课程团队
    roles: [teacher]
    evidence_policy:
      authoritative_source_types: [course_asset_manifest, teacher_reviewed_knowledge]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 学院课程负责人或教师发展中心
      delivery_unit: 单门课程备课工作台
      value_capture: 按课程包和教师席位提供院系级订阅或项目交付
      expansion_path: 从单课程扩展到专业课程群与教学质量分析
    courses: [CT, AE, DE]
    agent_id: TEACH_01_LESSON_PREP_V1
    intents: [lesson_prep]
    input_modes: [text]
    retrieval_profile: teaching_authoritative
    primary_value_metric: 备课资料整理耗时与来源覆盖率
    evidence_requirements: [课程目标对齐记录, 来源引用与页码, 教师复核记录]
    demo_steps: [D1目标对齐, D2课堂流程, D3形成性评价, D4来源审查, D5课程资产复用, D6拒绝自动发布]
    demo_cases:
      - id: lesson-design
        role: teacher
        course: CT
        prompt: >-
          我下周要给大二电子信息专业讲授电路理论中的节点电压法。请根据课程目标和可核验的课程资料，设计一份 50 分钟课堂方案：先写 3 个可观察的学习目标，再安排导入、概念讲解、带解例题、分层练习和出口条；列出学生最容易混淆的参考节点、支路电流方向和符号约定；为基础、达标、挑战三层学生各给一道练习；每个关键判断标注资料依据或明确说明资料不足；最后列出必须由教师复核的内容，并禁止自动发布未经审核的课件。
        expected_agent: TEACH_01_LESSON_PREP_V1
        expected_output: [learning_objectives, lesson_flow, common_misconceptions, differentiated_practice, evidence, review_boundary]
        business_context: 教师需要把一节具体课程从目标、讲解、练习到复核点组织成可审核的备课草稿。
        evidence_requirements: [课程目标或章节资料, 公式与例题来源, 资料页码或可追溯链接]
        review_boundary: 教师必须复核目标与课程标准、公式和例题条件、分层练习难度以及所有发布内容；系统不得自动发布。
        acceptance_conditions: [路由到 TEACH_01_LESSON_PREP_V1, 输出包含目标流程练习证据和复核边界, 资料不足时明确标注, 连续两次结构契约一致]
      - id: g2-08-mealy-moore-flipped-classroom
        role: teacher
        course: DE
        prompt: >-
          请设计一节 Mealy/Moore 状态机翻转课堂：课前 20 分钟，课堂讨论 30 分钟。课前任务要让学生比较两种状态机的输出时序并完成一个小练习；课堂需要安排状态图/状态表争议点、分组讨论、教师纠错和出口条。请标注需要课程资料或教师确认的引用、状态编码和评价标准，不要用通用知识冒充本课程材料，也不要自动发布。
        expected_agent: TEACH_01_LESSON_PREP_V1
        expected_output: [learning_objectives, lesson_flow, common_misconceptions, differentiated_practice, evidence, review_boundary]
        business_context: 教师需要把有限课前与课堂时间组织成可审核的翻转课堂草稿，并保留课程证据边界。
        evidence_requirements: [课程状态机章节资料, Mealy/Moore定义与示例, 课堂评价标准]
        review_boundary: 教师必须确认状态编码、时序图、课程目标和分层练习难度；系统不得自动发布未经审核的课件。
        acceptance_conditions: [路由到 TEACH_01_LESSON_PREP_V1, 课前20分钟和课堂30分钟约束可见, 比较状态机输出, 讨论与出口条齐全, 资料不足明确标记]
    enabled: true

  - id: assessment_diagnosis_v1
    version: "1.0"
    name: 作业批改与首错定位
    summary: 对学生作答进行步骤级诊断，输出首个关键错误、依据和下一道验证题。
    customer_segment: 高校教师、助教与智慧教学平台
    roles: [teacher]
    evidence_policy:
      authoritative_source_types: [course_pack, reviewed_error_pool, scoring_rubric]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 学院教务与智慧教学平台
      delivery_unit: 作业批次与教师审核席位
      value_capture: 按批次处理量和审核席位计费
      expansion_path: 从首错诊断扩展到题库、学情和课程质量服务
    courses: [CT, AE, DE]
    agent_id: TEACH_02_ASSIGNMENT_REVIEW_V1
    intents: [assignment_review]
    input_modes: [text]
    retrieval_profile: assessment_evidence
    primary_value_metric: 批改周转时间与首错定位一致性
    evidence_requirements: [标准答案或评分规则, 步骤级诊断, 教师抽检记录]
    demo_steps: [D1首错定位, D2分层提示, D3连锁错误, D4保留正确步骤, D5批次抽检, D6拒绝自动定分]
    demo_cases:
      - id: assignment-diagnosis
        role: teacher
        course: CT
        prompt: >-
          请诊断下面这份电路理论作业答案，目标不是直接给总分，而是找出学生第一次导致后续结论失效的关键错误。题目：含 2 个节点和 3 条支路的直流电阻网络，已知电阻与电流方向，要求用节点电压法求两节点电压。学生步骤：1）把参考节点选在左侧节点；2）在右侧节点写成 (V-12)/2 + V/4 - 3 = 0；3）整理得到 V=12；4）因此左侧节点电压也是 12V。请保留其中正确的建模步骤，解释首错与错误传播，分别给基础和进阶学生各一条提示，并生成一道只改变一个参数的验证题；缺少标准答案或评分规则的地方必须明确标为待教师复核。
        expected_agent: TEACH_02_ASSIGNMENT_REVIEW_V1
        expected_output: [first_error, error_cause, preserved_correct_steps, tiered_hints, verification_problem, evidence, review_boundary]
        business_context: 教师需要对单份作答做步骤级首错诊断，并把反馈转成下一次可验证的学习任务。
        evidence_requirements: [题目原文, 标准答案或评分规则, 公式和错误类型依据]
        review_boundary: 系统只做初审和反馈建议，不自动定分；教师需要确认首错、分值影响和验证题是否等价。
        acceptance_conditions: [路由到 TEACH_02_ASSIGNMENT_REVIEW_V1, 首错与后续错误分开, 正确步骤未被覆盖, 缺资料时进入人工复核, 连续两次结构契约一致]
      - id: g2-10-bypass-capacitor
        role: teacher
        course: AE
        prompt: >-
          学生认为共射放大电路加入射极旁路电容会降低输入电阻并使总电压增益减小。请精准定位逻辑首错，并重新梳理旁路电容对放大倍数影响的正向逻辑；不要直接给学生总分，并明确哪些判断需要教师复核。
        expected_agent: TEACH_02_ASSIGNMENT_REVIEW_V1
        expected_output: [first_error, error_cause, concept_correction, review_boundary]
        business_context: 教师需要定位模拟电子学作答中的首个因果错误，并纠正旁路电容与增益之间的概念关系。
        evidence_requirements: [学生原始判断, 旁路电容对交流等效的依据, 教师复核记录]
        review_boundary: 系统只做首错和概念纠正建议，不自动定分；教师需要结合频率范围、信号源内阻和电路参数复核结论。
        acceptance_conditions: [路由到 TEACH_02_ASSIGNMENT_REVIEW_V1, 首错与概念纠正分离, 不产生学生总分, 连续两次结构契约一致]
      - id: g2-11-cmos-power
        role: teacher
        course: DE
        prompt: >-
          学生认为 CMOS 逻辑门只要通电，无论输入频率多高，功耗都是固定常数。请诊断其对 CMOS 功耗构成的错误，并出一道区分静态功耗与动态功耗的验证题；不要直接生成学生分数，并明确教师复核边界。
        expected_agent: TEACH_02_ASSIGNMENT_REVIEW_V1
        expected_output: [first_error, error_cause, verification_task, review_boundary]
        business_context: 教师需要区分 CMOS 静态功耗和随翻转频率变化的动态功耗，并把纠错转成可验证任务。
        evidence_requirements: [学生原始判断, 静态与动态功耗依据, 验证题和教师复核记录]
        review_boundary: 系统只生成诊断和验证题建议，不自动定分；电压、负载、电容、翻转率和漏电参数需教师结合课程资料复核。
        acceptance_conditions: [路由到 TEACH_02_ASSIGNMENT_REVIEW_V1, 首错明确, 验证题区分静态与动态功耗, 不产生学生分数, 连续两次结构契约一致]
    enabled: true

  - id: student_learning_path_v1
    version: "1.0"
    name: 学情诊断与个性化学习路径
    summary: 根据学生的作答证据和薄弱点生成分阶段学习建议，并通过验证题闭环。
    customer_segment: 高校学生、学校教务与在线教育平台
    roles: [student, teacher]
    evidence_policy:
      authoritative_source_types: [learning_outcome, reviewed_error_pool, local_knowledge]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 学校教务处或在线教育平台
      delivery_unit: 学生学习路径与课程知识点
      value_capture: 按活跃学生数和课程包订阅
      expansion_path: 从个性化建议扩展到学习成效与教师干预闭环
    courses: [CT, AE, DE, SS, DSP, COMM]
    agent_id: LEARN_01_LOCAL_RETRIEVAL_V1
    intents: [learning_advice, explain_concept]
    input_modes: [text]
    retrieval_profile: student_fast_grounded
    primary_value_metric: 学习路径完成率与知识点掌握证据覆盖率
    evidence_requirements: [历史作答证据, 推荐理由, 复测结果]
    demo_steps: [D1证据摘要, D2先修路径, D3复测更新, D4教师干预, D5跨主题隔离, D6拒绝能力判定]
    demo_cases:
      - id: learning-path
        role: student
        course: CT
        prompt: >-
          我最近三次电路理论练习中，KCL 选择题分别得分 80、60、40 分；涉及参考方向的题目经常把支路电流符号写反，但电阻串并联化简基本正确。请根据这些答题证据识别最可能的薄弱知识点，不要把一次错误当成能力定论；制定一个为期 7 天、每天不超过 25 分钟的分阶段学习路径，说明每一天的先修关系、练习目标和完成证据，并安排至少两道用于验证是否真正改善的任务。如果证据不足以支持某个判断，请明确说明并把需要教师介入的节点列出来。
        expected_agent: LEARN_01_LOCAL_RETRIEVAL_V1
        expected_output: [evidence_summary, weak_knowledge_points, prerequisite_path, staged_plan, verification_tasks, evidence, review_boundary]
        business_context: 学生需要把多次作答证据转成可执行、可复测且不越权的个性化学习计划。
        evidence_requirements: [历史作答记录, 知识点与先修关系资料, 复测结果]
        review_boundary: 学习建议不能替代正式能力认定；教师可调整路径、阈值和干预点，系统必须区分证据与推测。
        acceptance_conditions: [路由到 LEARN_01_LOCAL_RETRIEVAL_V1, 薄弱点有证据对应, 计划包含复测任务, 无证据时明确缺口, 连续两次结构契约一致]
      - id: g2-12-power-training
        role: student
        course: AE
        prompt: >-
          距离全国大学生电子设计竞赛电源类方向还有四周，已掌握Buck/Boost基础但缺乏闭环控制和PCB抗干扰经验。请按四周和每周目标规划训练任务、核心复核点、推荐验证实验、测量记录以及需要教师确认的电源安全边界。
        expected_agent: LEARN_01_LOCAL_RETRIEVAL_V1
        expected_output: [evidence_summary, weak_knowledge_points, prerequisite_path, staged_plan, verification_tasks, evidence, review_boundary]
        business_context: 学生需要把电源竞赛准备目标拆成四周可执行训练、复核点和实验验证，并保留安全与教师介入边界。
        evidence_requirements: [已有Buck/Boost基础, 闭环控制与PCB抗干扰资料, 每周训练与实验记录]
        review_boundary: 学习建议不能替代竞赛方案或电源安全审核；教师需复核环路测量、功率器件应力、PCB布局和实验条件。
        acceptance_conditions: [路由到 LEARN_01_LOCAL_RETRIEVAL_V1, 四周计划与每周目标齐全, 验证实验可执行, 安全与证据缺口明确, 不作能力定论]
      - id: g2-05-bjt-two-week-plan
        role: student
        course: AE
        prompt: >-
          根据学生在BJT静态工作点设置和动态参数测试中的实验失误，制定为期两周的个性化专项复习计划，
          包含具体复盘任务、每天可执行的练习、静态与动态参数的验证记录，以及需要导师介入指导的可验证节点。
          不要仅凭一次实验失误判定能力；请区分已有证据、合理推测和仍需补充的测量数据。
        expected_agent: LEARN_01_LOCAL_RETRIEVAL_V1
        expected_output: [evidence_summary, weak_knowledge_points, prerequisite_path, staged_plan, verification_tasks, evidence, review_boundary]
        business_context: 学生需要把BJT实验中的静态工作点与动态参数错误转成两周可执行、可复测且有导师介入边界的专项复习计划。
        evidence_requirements: [BJT静态工作点实验记录, 动态参数测试记录, 两周复盘与练习证据, 导师介入确认记录]
        review_boundary: 学习路径不能替代实验安全和能力认定；工作区判断、测量接线、仪器量程与异常波形必须由教师结合原始记录复核。
        acceptance_conditions: [路由到 LEARN_01_LOCAL_RETRIEVAL_V1, 计划覆盖两周时间轴, 静态与动态错误分别复盘, 每周包含验证任务, 导师介入节点可触发, 证据不足时明确缺口]
      - id: g2-13-laplace-physics
        role: student
        course: CT
        prompt: >-
          学生会熟练计算拉普拉斯变换，但无法理解极点分布与系统响应的物理意义。请设计知识降维与重构的复习路径，连接极点、时域响应、稳定性和具体验证题，帮助建立直观物理图像并给出可观察的前后测证据。
        expected_agent: LEARN_01_LOCAL_RETRIEVAL_V1
        expected_output: [evidence_summary, weak_knowledge_points, prerequisite_path, staged_plan, verification_tasks, evidence, review_boundary]
        business_context: 学生需要把形式化的拉普拉斯计算连接到极点、时域响应和稳定性，并通过前后测验证理解迁移。
        evidence_requirements: [已有拉普拉斯作答证据, 极点与时域响应资料, 前后测和教师复核记录]
        review_boundary: 学习路径不能据一次描述作能力定论；极点、稳定性和物理解释需结合具体系统与课程资料由教师复核。
        acceptance_conditions: [路由到 LEARN_01_LOCAL_RETRIEVAL_V1, 计划包含极点到时域响应的桥接, 至少两项验证任务, 数学和物理边界明确, 不输出泛化鸡汤]
    enabled: true

  - id: rubric_generation_v1
    version: "1.0"
    name: 教师评分量规生成
    summary: 为课程项目生成可审核的多维评分量规，不对具体学生自动定分。
    customer_segment: 高校教师与课程团队
    roles: [teacher]
    evidence_policy:
      authoritative_source_types: [course_standard, teacher_reviewed_rubric]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 学院课程负责人或教师发展中心
      delivery_unit: 课程项目评分量规
      value_capture: 按课程包和教师席位提供院系级订阅或项目交付
      expansion_path: 从量规草稿扩展到教师审核和批次抽检
    courses: [CT, AE, DE, SS, DSP, COMM]
    agent_id: GENERAL_QUESTION_V1
    intents: [general_qa]
    input_modes: [text]
    retrieval_profile: teaching_authoritative
    primary_value_metric: 评分维度覆盖率与教师复核效率
    evidence_requirements: [课程项目要求, 评分维度定义, 教师复核记录]
    demo_steps: [D1维度覆盖, D2等级描述, D3证据要求, D4课程边界, D5拒绝自动定分, D6教师复核]
    demo_cases:
      - id: g2-09-fpga-clock-rubric
        role: teacher
        course: DE
        prompt: >-
          请为FPGA数字钟项目生成评分量规。评分维度必须包含：代码规范性、资源占用率、功能完整性、防抖动处理；每个维度必须定义优秀、良好、及格、不及格四个等级。不要评估任何具体学生，也不要给出学生分数。课程未提供具体板卡和阈值时，请标记为通用建议/待教师确认。
        expected_agent: GENERAL_QUESTION_V1
        expected_output: [rubric_dimensions, rubric_levels, student_score_excluded, review_boundary]
        business_context: 教师需要一个覆盖四个评价维度和四个等级的可审核量规草稿，而不是学生批改结果。
        evidence_requirements: [FPGA项目要求, 板卡资源规格, 去抖和功能验收标准]
        review_boundary: 教师必须确认板卡型号、资源阈值、功能范围和去抖时间；系统不得自动评估学生或生成学生分数。
        acceptance_conditions: [路由到 GENERAL_QUESTION_V1, 四个维度齐全, 四个等级齐全, 不产生学生分数, 课程参数缺失时标记待确认]
    enabled: true

  - id: research_frontier_radar_v1
    version: "1.0"
    name: 科研前沿检索与证据简报
    summary: 面向科研人员整理研究问题、前沿文献、关键结论和证据边界。
    customer_segment: 高校科研团队、研究院与技术企业研发部门
    roles: [researcher, teacher]
    evidence_policy:
      authoritative_source_types: [academic_paper, local_knowledge]
      supplemental_source_types: [web_page, synthetic]

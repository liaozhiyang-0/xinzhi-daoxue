        review_boundary: 阈值、输入方向或时间顺序无法确认时必须待复核。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 阈值和状态时序进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [transfer_thresholds, triangular_input_direction, output_levels, time_order]
          refuse_if_missing: [thresholds, input_direction_or_time_order]
    enabled: true


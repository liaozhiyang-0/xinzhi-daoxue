  - id: academic_visual_problem_solver_v1
    version: "1.0"
    name: 学术题图视觉求解与结构验收
    summary: 面向学生和教师，对课程题图先做真实视觉结构化验收，再进入可复核的专业问题求解。
    customer_segment: 高校学生、教师与实验课程团队
    roles: [student, teacher]
    evidence_policy:
      authoritative_source_types: [user_provided_problem_image, course_pack]
      supplemental_source_types: [external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: false
    commercialization:
      buyer: 学院实验课程负责人或智慧教学平台
      delivery_unit: 单道题图求解与视觉验收任务
      value_capture: 按课程题库和视觉求解任务量提供院系级服务
      expansion_path: 从单题求解扩展到题库审核、实验报告和课程诊断
    courses: [CT, AE, DE, SS, DSP, COMM, RF, EM, INFO, EMBEDDED, IC]
    agent_id: ACADEMIC_PROBLEM_SOLVER
    intents: [solve_problem]
    input_modes: [text, image, mixed]
    retrieval_profile: academic_problem_visual
    primary_value_metric: 题图结构字段完整率与人工复核后可用率
    evidence_requirements: [原图哈希, 视觉结构化结果, 公式与单位检查, 人工复核边界]
    demo_steps: [D1输入哈希, D2视觉结构化, D3视觉验收, D4专业求解, D5公式单位检查, D6复核与拒答]
    demo_cases:
      - id: signal-convolution
        role: student
        course: SS
        prompt: >-
          请根据上传的连续时间信号题图和题干，先提取每个信号的支撑区间、幅值、关键端点与重叠拐点，再求卷积的完整分段表达式和波形。输出必须区分视觉识别事实、数学推导、需要人工复核的内容；如果题图关键字段无法确认，不得补猜唯一数值。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, piecewise_expression, waveform, breakpoint_explanation, review_boundary]
        business_context: 学生需要对带题图的信号与系统问题获得可追溯、可复核的专业求解，而不是把图片摘要直接当成确定事实。
        evidence_requirements: [题目原图与哈希, 支撑区间和幅值, 视觉验收结果, 分段公式与复核边界]
        review_boundary: 图像字段缺失、视觉结构不确定或公式渲染不安全时必须进入待复核/拒答；系统不得自动发布未经确认的题图结论。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 结构字段和公式进入最终正文, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: ["x_support:[0,1]", "h_support:[0,4]"]
          refuse_if_missing: [support_interval, amplitude_or_scale]
      - id: bandpass-sampling
        role: student
        course: CT
        prompt: >-
          实信号频谱正频带仅在 8–10 kHz、负频带仅在 -10–-8 kHz 非零。允许带通采样时，求不混叠的理论最小 fs，写出带通采样条件，解释为什么 20 kHz 不是最小答案，并说明工程上为何不取理论极限。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要从频谱题图得到带通采样边界、单位和工程约束的可复核推导。
        evidence_requirements: [题目原图与哈希, 正负频带与单位, 采样条件推导, 人工复核边界]
        review_boundary: 频带边界、正负频率方向或单位无法确认时必须待复核，不得补猜采样率。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 频带和单位进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: ["positive_band:[8,10]kHz", "negative_band:[-10,-8]kHz", frequency_units]
          refuse_if_missing: [band_edges, frequency_units]
      - id: thevenin-max-power
        role: student
        course: CT
        prompt: >-
          图中所有电阻为10 Ω，左侧理想电压源16 V，右侧理想电压源8 V，负载为 R。求从负载端看入的 Vth、Rth、最大功率条件、最大功率、负载电压和电流，并明确列出端口参考方向与每一步等效依据。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要对含多个独立源的戴维南等效和最大功率题图获得可复核结果。
        evidence_requirements: [题目原图与哈希, 负载端口, 源极性与阻值, Vth/Rth 与功率推导]
        review_boundary: 负载端口、源极性或电阻值无法确认时必须待复核，不得继续数值求解。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 端口和源参数进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [load_terminals, "independent_sources:16V/8V", "resistor_values:10Ω", vth_rth_port]
          refuse_if_missing: [load_terminals, source_polarity_or_value]
      - id: dependent-source-power
        role: student
        course: CT
        prompt: >-
          按图示参考方向，独立电流源2 A、中间理想电压源4 V、右侧电阻4 Ω、受控电流源0.25u、受控电压源3i、1 Ω电阻电压为u。求 i、u、受控源值及受控电压源功率，并按关联参考方向判断吸收或发出功率。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要对含受控源和功率参考方向的电路题图进行符号一致的求解。
        evidence_requirements: [题目原图与哈希, 参考方向, 受控关系, 功率参考方向, 方程与符号检查]
        review_boundary: 参考方向或受控源关系无法确认时必须待复核，不得补猜功率正负号。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 受控关系和功率符号进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [reference_directions, "dependent_relations:0.25u/3i", power_reference_direction]
          refuse_if_missing: [reference_direction, dependent_source_relation]
      - id: bjt-region-boundary
        role: student
        course: AE
        prompt: >-
          分压偏置共射放大器 VCC=12 V、RB1=20 kΩ、RB2=10 kΩ、RC=3 kΩ、RE=2 kΩ、RL=3 kΩ、β=80、UBE≈0.7 V。求静态工作点、小信号参数与增益；再将 RC 增至6 kΩ，先检查工作区再判断能否继续使用放大区公式，并估算饱和状态。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要在晶体管参数变化后先做工作区边界检查，再决定放大区公式是否适用。
        evidence_requirements: [题目原图与哈希, 晶体管端点, 偏置参数, RC 变化, 工作区边界与单位]
        review_boundary: 晶体管端点、偏置值或工作区边界无法确认时必须待复核。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 参数和工作区判定进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [transistor_terminals, bias_network_values, "rc_change:3k_to_6k", operating_region_boundary]
          refuse_if_missing: [transistor_terminals, bias_values_or_region_boundary]
      - id: instrumentation-amplifier
        role: student
        course: AE
        prompt: >-
          典型三运放仪表放大器中 R1=10 kΩ、RG=2 kΩ、R2=10 kΩ、R3=20 kΩ，V1=50 mV、V2=20 mV。判断反馈类型，推导差模增益并计算 Vo，说明理想输入/输出电阻及 RG 变化的影响。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要从仪表放大器题图恢复三级拓扑、阻值、输入极性并完成增益推导。
        evidence_requirements: [题目原图与哈希, A1/A2/A3 拓扑, 阻值和输入极性, 增益公式与单位]
        review_boundary: 运放拓扑、阻值或输入极性无法确认时必须待复核。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 拓扑和公式进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [a1_a2_a3_topology, r1_rg_r2_r3, v1_v2_polarity]
          refuse_if_missing: [amplifier_topology, resistor_values]
      - id: r2r-dac
        role: student
        course: DE
        prompt: >-
          4位倒T形/R-2R DAC 中 R=10 kΩ、RF=R、VREF=10 V，D3D2D1D0=1011，Di=1 接运放反相求和端、Di=0 接地。求1 LSB、Vo、一般表达式并解释输出负号。
        expected_agent: ACADEMIC_PROBLEM_SOLVER
        expected_output: [visual_structure, visual_acceptance, solution, review_boundary]
        business_context: 学生需要从 DAC 题图确认位序、网络拓扑和参考电压后完成量化输出计算。
        evidence_requirements: [题目原图与哈希, D3-D0 位序, R-2R 网络, 运放求和节点, VREF/RF 与单位]
        review_boundary: 位序、网络拓扑或求和节点无法确认时必须待复核。
        acceptance_conditions: [路由到 ACADEMIC_PROBLEM_SOLVER, 输入附件哈希可追踪, 视觉验收先于求解, 位权和输出符号进入结果, 缺失字段明确拒答, 连续两次结构契约一致]
        visual_acceptance:
          must_capture: [d3_to_d0_order, r2r_network, opamp_summing_node, vref_rf]
          refuse_if_missing: [bit_order, network_topology]
      - id: schmitt-threshold
        role: student
        course: DE
        prompt: >-
          555施密特触发器输出高约3.2 V、低约0.3 V，输入三角波从0 V升至9 V再降至0 V。由图读出上下翻转阈值，求 VT+、VT-、回差及完整输出时序，并说明回差意义。

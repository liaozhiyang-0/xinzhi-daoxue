  - id: research_frontier_radar_v1
    version: "1.0"
    name: 科研前沿检索与证据简报
    summary: 面向科研人员整理研究问题、前沿文献、关键结论和证据边界。
    customer_segment: 高校科研团队、研究院与技术企业研发部门
    roles: [researcher, teacher]
    evidence_policy:
      authoritative_source_types: [academic_paper, local_knowledge]
      supplemental_source_types: [web_page, synthetic]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
      freshness_days: 1095
    commercialization:
      buyer: 科研院所、企业研发部门或科研服务平台
      delivery_unit: 研究问题证据简报
      value_capture: 按科研团队席位或检索简报额度订阅
      expansion_path: 从文献雷达扩展到项目申报、综述与技术情报
    courses: [CT, AE, DE, SS, DSP, COMM, RF, EM, INFO, EMBEDDED, IC]
    agent_id: RESEARCH_01_ACADEMIC_SEARCH_V1
    intents: [general_qa, academic_search]
    input_modes: [text]
    retrieval_profile: research_citation
    primary_value_metric: 文献筛选与证据简报产出耗时
    evidence_requirements: [文献唯一标识, 结论来源, 检索时间与局限性]
    demo_steps: [D1研究问题范围, D2学术证据表, D3开放问题, D4检索时间边界, D5导出引用简报, D6无证据时拒答]
    enabled: true

  - id: research_data_workbench_v1
    version: "1.0"
    name: 科研数据分析与可复现解释
    summary: 将科研数据问题转化为可执行分析步骤、代码或公式，并明确质量与限制。
    customer_segment: 高校科研团队、实验室与产业研发部门
    roles: [researcher, teacher]
    evidence_policy:
      authoritative_source_types: [authorized_dataset, method_reference, experiment_protocol]
      supplemental_source_types: [synthetic, external_reference]
      citation_required: true
      manual_review_required: true
      allow_synthetic: true
    commercialization:
      buyer: 实验室负责人或产业研发部门
      delivery_unit: 单个研究数据分析任务
      value_capture: 按研究项目和可复现分析任务交付
      expansion_path: 从分析方案扩展到实验管理、报告和知识沉淀
    courses: [CT, AE, DE]
    agent_id: RESEARCH_03_DATA_ANALYSIS_V1
    intents: [data_analysis]
    input_modes: [text, mixed, image, pdf]
    retrieval_profile: reproducible_analysis
    primary_value_metric: 分析方案复现成功率与研究迭代耗时
    evidence_requirements: [数据质量检查, 可执行代码或公式, 方法与局限性]
    demo_steps: [D1仅数据字典, D2数据质量检查, D3已有结果解释, D4可执行代码, D5方法选择, D6无数据不出结论]
    enabled: true


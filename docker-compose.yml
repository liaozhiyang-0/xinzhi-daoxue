# 固定 Compose 项目名与卷名，确保换目录、重新克隆和重启 Docker 后仍复用同一套数据。
name: xinzhi-daoxue

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: xzd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xzd}
      POSTGRES_USER: ${POSTGRES_USER:-xzd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xzd_password}
    ports:
      - "5432:5432"
    volumes:
      - xzd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xzd_user} -d ${POSTGRES_DB:-xzd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: xzd-redis
    ports:
      - "6379:6379"
    volumes:
      - xzd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: xzd-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-xzd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - xzd_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: xzd-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - xzd_qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_REQUIREMENT: ${TORCH_REQUIREMENT:-torch>=2.7,<3}
    container_name: xzd-api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://xzd_user:xzd_password@postgres:5432/xzd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_EXECUTOR_MODE: ${TASK_EXECUTOR_MODE:-local}
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-xzd:tasks}
      TASK_QUEUE_BLOCK_TIMEOUT_SECONDS: ${TASK_QUEUE_BLOCK_TIMEOUT_SECONDS:-5}
      TASK_WORKER_RECOVERY_INTERVAL_SECONDS: ${TASK_WORKER_RECOVERY_INTERVAL_SECONDS:-15}
      TASK_WORKER_LOCK_TTL_SECONDS: ${TASK_WORKER_LOCK_TTL_SECONDS:-120}
      TASK_QUEUE_DEAD_LETTER_ENABLED: ${TASK_QUEUE_DEAD_LETTER_ENABLED:-true}
      TASK_QUEUE_DEAD_LETTER_MAX_ATTEMPTS: ${TASK_QUEUE_DEAD_LETTER_MAX_ATTEMPTS:-3}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-xzd_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-xzd-files}
      DEFAULT_AGENT_PROVIDER: ${DEFAULT_AGENT_PROVIDER:-local}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-false}
      # Keep the data-analysis product freeze explicit; enable only for an
      # authorized development canary after its readiness gates pass.
      DATA_ANALYSIS_ENABLED: ${DATA_ANALYSIS_ENABLED:-false}
      LOCAL_STORAGE_FALLBACK: ${LOCAL_STORAGE_FALLBACK:-true}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/local_storage}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_CT_PATH: /knowledge/CT
      KNOWLEDGE_AE_PATH: /knowledge/AE
      KNOWLEDGE_DE_PATH: /knowledge/DE
      KNOWLEDGE_SS_PATH: /knowledge/SS
      KNOWLEDGE_DSP_PATH: /knowledge/DSP
      KNOWLEDGE_COMM_PATH: /knowledge/COMM
      KNOWLEDGE_CHUNK_SIZE_CHARS: ${KNOWLEDGE_CHUNK_SIZE_CHARS:-400}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-150}
      KNOWLEDGE_DEFAULT_TOP_K: ${KNOWLEDGE_DEFAULT_TOP_K:-5}
      KNOWLEDGE_MAX_FILES_PER_COURSE: ${KNOWLEDGE_MAX_FILES_PER_COURSE:-1000}
      KNOWLEDGE_MAX_FILE_SIZE_MB: ${KNOWLEDGE_MAX_FILE_SIZE_MB:-5}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      TEXT_EMBEDDING_MODEL: ${TEXT_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      TEXT_EMBEDDING_REVISION: ${TEXT_EMBEDDING_REVISION:-7999e1d3359715c523056ef9478215996d62a620}
      TEXT_EMBEDDING_DEVICE: ${TEXT_EMBEDDING_DEVICE:-auto}
      IMAGE_EMBEDDING_MODEL: ${IMAGE_EMBEDDING_MODEL:-google/siglip2-base-patch16-224}
      IMAGE_EMBEDDING_DEVICE: ${IMAGE_EMBEDDING_DEVICE:-auto}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-auto}
      # Local HF snapshots are mounted read-only; offline mode prevents the
      # hub from writing optional-file negative-cache metadata at warmup.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_TRUST_ENV: ${QDRANT_TRUST_ENV:-false}
    volumes:
      - type: bind
        source: ${HF_MODEL_CACHE_HOST_PATH:-./local_storage/huggingface}
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${QUESTION_BANK_IMAGE_HOST_PATH:-./evaluation/cache/storage}
        target: /workspace/evaluation/cache/storage
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_CT_HOST_PATH:-./local_knowledge/CT}
        target: /knowledge/CT
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_AE_HOST_PATH:-./local_knowledge/AE}
        target: /knowledge/AE
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_DE_HOST_PATH:-./local_knowledge/DE}
        target: /knowledge/DE
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_SS_HOST_PATH:-./local_knowledge/SS}
        target: /knowledge/SS
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_DSP_HOST_PATH:-./local_knowledge/DSP}
        target: /knowledge/DSP
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_COMM_HOST_PATH:-./local_knowledge/COMM}
        target: /knowledge/COMM
        read_only: true
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  queue-worker:
    profiles: ["queue-worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_REQUIREMENT: ${TORCH_REQUIREMENT:-torch>=2.7,<3}
    container_name: xzd-queue-worker
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      PYTHONPATH: /workspace/apps/api
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://xzd_user:xzd_password@postgres:5432/xzd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_EXECUTOR_MODE: local
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-xzd:tasks}
      TASK_QUEUE_BLOCK_TIMEOUT_SECONDS: ${TASK_QUEUE_BLOCK_TIMEOUT_SECONDS:-5}
      TASK_WORKER_RECOVERY_INTERVAL_SECONDS: ${TASK_WORKER_RECOVERY_INTERVAL_SECONDS:-15}
      TASK_WORKER_LOCK_TTL_SECONDS: ${TASK_WORKER_LOCK_TTL_SECONDS:-120}
      TASK_QUEUE_DEAD_LETTER_ENABLED: ${TASK_QUEUE_DEAD_LETTER_ENABLED:-true}
      TASK_QUEUE_DEAD_LETTER_MAX_ATTEMPTS: ${TASK_QUEUE_DEAD_LETTER_MAX_ATTEMPTS:-3}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-xzd_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-xzd-files}
      DEFAULT_AGENT_PROVIDER: ${DEFAULT_AGENT_PROVIDER:-local}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-false}
      DATA_ANALYSIS_ENABLED: ${DATA_ANALYSIS_ENABLED:-false}
      LOCAL_STORAGE_FALLBACK: ${LOCAL_STORAGE_FALLBACK:-true}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/local_storage}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_CT_PATH: /knowledge/CT
      KNOWLEDGE_AE_PATH: /knowledge/AE
      KNOWLEDGE_DE_PATH: /knowledge/DE
      KNOWLEDGE_SS_PATH: /knowledge/SS
      KNOWLEDGE_DSP_PATH: /knowledge/DSP
      KNOWLEDGE_COMM_PATH: /knowledge/COMM
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_TRUST_ENV: ${QDRANT_TRUST_ENV:-false}
    volumes:
      - type: bind
        source: ${HF_MODEL_CACHE_HOST_PATH:-./local_storage/huggingface}
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_CT_HOST_PATH:-./local_knowledge/CT}
        target: /knowledge/CT
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_AE_HOST_PATH:-./local_knowledge/AE}
        target: /knowledge/AE
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_DE_HOST_PATH:-./local_knowledge/DE}
        target: /knowledge/DE
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_SS_HOST_PATH:-./local_knowledge/SS}
        target: /knowledge/SS
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_DSP_HOST_PATH:-./local_knowledge/DSP}
        target: /knowledge/DSP
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_COMM_HOST_PATH:-./local_knowledge/COMM}
        target: /knowledge/COMM
        read_only: true
    command: ["python", "/workspace/apps/worker/worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  xzd_postgres_data:
    name: xinzhi-daoxue_xzd_postgres_data
  xzd_redis_data:
    name: xinzhi-daoxue_xzd_redis_data
  xzd_minio_data:
    name: xinzhi-daoxue_xzd_minio_data
  xzd_qdrant_data:
    name: xinzhi-daoxue_xzd_qdrant_data

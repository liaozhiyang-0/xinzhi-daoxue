services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: xzd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xzd}
      POSTGRES_USER: ${POSTGRES_USER:-xzd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xzd_password}
    ports:
      - "5432:5432"
    volumes:
      - xzd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xzd_user} -d ${POSTGRES_DB:-xzd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: xzd-redis
    ports:
      - "6379:6379"
    volumes:
      - xzd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: xzd-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-xzd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - xzd_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xzd-api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://xzd_user:xzd_password@postgres:5432/xzd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-xzd_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-xzd-files}
      DEFAULT_AGENT_PROVIDER: ${DEFAULT_AGENT_PROVIDER:-mock}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-true}
      XINGCHEN_ENABLED: ${XINGCHEN_ENABLED:-false}
      XINGCHEN_PUBLICATION_STATUS: ${XINGCHEN_PUBLICATION_STATUS:-published}
      XINGCHEN_BASE_URL: ${XINGCHEN_BASE_URL:-https://xingchen-api.xf-yun.com}
      XINGCHEN_WORKFLOW_PATH: ${XINGCHEN_WORKFLOW_PATH:-/workflow/v1/chat/completions}
      XINGCHEN_API_KEY: ${XINGCHEN_API_KEY:-}
      XINGCHEN_API_SECRET: ${XINGCHEN_API_SECRET:-}
      XINGCHEN_SOLVER_CT_FLOW_ID: ${XINGCHEN_SOLVER_CT_FLOW_ID:-}
      XINGCHEN_UID: ${XINGCHEN_UID:-local-demo-user}
      XINGCHEN_TIMEOUT_SECONDS: ${XINGCHEN_TIMEOUT_SECONDS:-150}
      XINGCHEN_USE_LOCAL_KB_CONTEXT: ${XINGCHEN_USE_LOCAL_KB_CONTEXT:-true}
      XINGCHEN_BOT_ID: ${XINGCHEN_BOT_ID:-}
      LOCAL_STORAGE_FALLBACK: ${LOCAL_STORAGE_FALLBACK:-true}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/local_storage}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_CT_PATH: /knowledge/CT
      KNOWLEDGE_AE_PATH: /knowledge/AE
      KNOWLEDGE_DE_PATH: /knowledge/DE
      KNOWLEDGE_CHUNK_SIZE_CHARS: ${KNOWLEDGE_CHUNK_SIZE_CHARS:-1200}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-150}
      KNOWLEDGE_DEFAULT_TOP_K: ${KNOWLEDGE_DEFAULT_TOP_K:-5}
      KNOWLEDGE_MAX_FILES_PER_COURSE: ${KNOWLEDGE_MAX_FILES_PER_COURSE:-1000}
      KNOWLEDGE_MAX_FILE_SIZE_MB: ${KNOWLEDGE_MAX_FILE_SIZE_MB:-5}
    volumes:
      - type: bind
        source: ${KNOWLEDGE_CT_HOST_PATH:-./local_knowledge/CT}
        target: /knowledge/CT
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_AE_HOST_PATH:-./local_knowledge/AE}
        target: /knowledge/AE
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_DE_HOST_PATH:-./local_knowledge/DE}
        target: /knowledge/DE
        read_only: true
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  xzd_postgres_data:
  xzd_redis_data:
  xzd_minio_data:
